<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Showcase - Display</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="showcase-container">
        <div class="content-wrapper">
            <!-- Left Panel: Demo Website -->
            <div class="panel left-panel">
                <iframe id="demoIframe" class="iframe-display"></iframe>
            </div>

            <!-- Resizable Divider -->
            <div class="divider" id="divider"></div>

            <!-- Right Panel: Programme Information -->
            <div class="panel right-panel">
                <div class="panel-header">
                    <img src="assets/hkiit_logo.png" class="info-logo" alt="HKIIT Logo">
                    <span class="panel-header-title">
                        <span class="title-eng">Programme Information</span>
                        <span class="title-chi">課程資訊</span>
                    </span>
                </div>

                <div class="info-container">

                    <!-- Programme Name -->
                    <div class="prog-name">
                        <p id="progNameEngDisplay"></p>
                        <p id="progNameChiDisplay" lang="zh-Hant"></p>
                        <div class="course-code-badge">
                            <span class="course-code-label">Course Code</span>
                            <span id="courseCodeDisplay"></span>
                        </div>
                    </div>

                    <!-- QR Section: vertically centred in remaining space -->
                    <div class="qr-section">
                        <!-- Slogan -->
                        <div class="slogan">
                            <p id="sloganEngDisplay"></p>
                            <p id="sloganChiDisplay" lang="zh-Hant"></p>
                        </div>

                        <!-- QR Code -->
                        <div class="qr-block">
                            <img id="qrImage" class="qr-image" src="" alt="QR Code">
                        </div>

                        <!-- Animated arrow pointing up toward QR -->
                        <div class="qr-arrow">&#8679;</div>

                        <!-- Scan text -->
                        <div class="scan-text">
                            <p>Scan and Bookmark Me</p>
                            <p lang="zh-Hant">掃描並加入書籤吧</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gear / Setup button fixed to lower-right corner -->
    <button id="setupBtn" class="setup-btn" title="Setup">⚙</button>

    <script src="script.js"></script>
</body>
</html>

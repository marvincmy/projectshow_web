<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Showcase - Display</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="showcase-container">
        <div class="content-wrapper">
            <!-- Left Panel: Demo Website -->
            <div class="panel left-panel">
                <iframe id="demoIframe" class="iframe-display"></iframe>
            </div>

            <!-- Resizable Divider -->
            <div class="divider" id="divider"></div>

            <!-- Right Panel: Programme Information -->
            <div class="panel right-panel">

                <!-- Top: Logo + title -->
                <div class="panel-header">
                    <img src="assets/hkiit_logo.png" class="info-logo" alt="HKIIT Logo">
                    <span class="panel-header-title">
                        <span class="title-eng">Programme Information</span>
                        <span class="title-chi">課程資訊</span>
                    </span>
                </div>

                <!-- Persistent: Programme code + name across all slides -->
                <div class="persistent-info">
                    <div class="course-code-badge">
                        <span id="courseCodeDisplay"></span>
                    </div>
                    <p id="progNameEngDisplay"></p>
                    <p id="progNameChiDisplay" lang="zh-Hant"></p>
                </div>

                <!-- Slides wrapper -->
                <div class="slides-wrapper">

                    <!-- Animated background blobs -->
                    <div class="bg-waves" aria-hidden="true">
                        <div class="bg-blob b1"></div>
                        <div class="bg-blob b2"></div>
                        <div class="bg-blob b3"></div>
                    </div>

                    <!-- Slide 1: Slogan + Project QR -->
                    <div class="slide active" id="slide1">
                        <div class="info-container">
                            <div class="qr-section">
                                <div class="slogan">
                                    <p id="sloganEngDisplay"></p>
                                    <p id="sloganChiDisplay" lang="zh-Hant"></p>
                                </div>
                                <div class="qr-block">
                                    <img id="qrImage" class="qr-image" src="" alt="Project QR Code">
                                </div>
                                <div class="qr-arrow">&#8679;</div>
                                <div class="scan-text">
                                    <p>Scan and Bookmark Me</p>
                                    <p lang="zh-Hant">掃描並加入書籤吧</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Slide 2: Programme Details — Chinese -->
                    <div class="slide" id="slide2">
                        <div class="info-container info-container-2">

                            <div class="prog-detail-block">
                                <h3 class="detail-heading">
                                    <span lang="zh-Hant">課程簡介</span>
                                </h3>
                                <p id="progDescChiDisplay" class="detail-text" lang="zh-Hant"></p>
                            </div>

                            <div class="prog-detail-block">
                                <h3 class="detail-heading">
                                    <span lang="zh-Hant">主要科目</span>
                                </h3>
                                <p id="majorSubjectsChiDisplay" class="detail-text" lang="zh-Hant"></p>
                            </div>

                            <!-- Programme QR pinned to bottom -->
                            <div class="qr-section qr-section-bottom">
                                <div class="qr-block">
                                    <img id="progQrImage" class="qr-image" src="" alt="Programme QR Code">
                                </div>
                                <div class="scan-text scan-text-pink">
                                    <p>Scan for Programme Info</p>
                                    <p lang="zh-Hant">掃描了解更多課程資訊</p>
                                </div>
                            </div>

                        </div>
                    </div>

                    <!-- Slide 3: Programme Details — English -->
                    <div class="slide" id="slide3">
                        <div class="info-container info-container-2">

                            <div class="prog-detail-block">
                                <h3 class="detail-heading">
                                    <span>Programme Description</span>
                                </h3>
                                <p id="progDescEngDisplay" class="detail-text"></p>
                            </div>

                            <div class="prog-detail-block">
                                <h3 class="detail-heading">
                                    <span>Major Subjects</span>
                                </h3>
                                <p id="majorSubjectsEngDisplay" class="detail-text"></p>
                            </div>

                            <!-- Programme QR pinned to bottom -->
                            <div class="qr-section qr-section-bottom">
                                <div class="qr-block">
                                    <img id="progQrImage2" class="qr-image" src="" alt="Programme QR Code">
                                </div>
                                <div class="scan-text scan-text-pink">
                                    <p>Scan for Programme Info</p>
                                    <p lang="zh-Hant">掃描了解更多課程資訊</p>
                                </div>
                            </div>

                        </div>
                    </div>

                </div>

                <!-- Dot bar: gear | dots | pause/play -->
                <div class="slide-dots">
                    <button id="setupBtn" class="dots-bar-btn" title="Setup">⚙</button>
                    <div class="dots-group">
                        <span class="dot active" data-slide="0"></span>
                        <span class="dot" data-slide="1"></span>
                        <span class="dot" data-slide="2"></span>
                    </div>
                    <button id="pauseBtn" class="dots-bar-btn" title="Pause / Play">⏸</button>
                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

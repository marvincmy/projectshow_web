<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Showcase - Setup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="start-screen">
        <div class="start-container">
            <h1>Project Showcase</h1>
            <p class="subtitle">Configure your showcase display</p>

            <!-- Section 1: Project URLs -->
            <div class="setup-section">
                <div class="setup-section-header">
                    <h3 class="setup-section-title">Project</h3>
                    <label class="toggle-label">
                        <span class="toggle-text">Show Project Slide</span>
                        <input type="checkbox" id="showSlide1" checked>
                        <span class="toggle-switch"></span>
                    </label>
                </div>

                <div class="input-section">
                    <label for="projTitleEng">Project Title (Eng):</label>
                    <input type="text" id="projTitleEng" value="Smart Trash Scanner">
                </div>

                <div class="input-section">
                    <label for="projTitleChi">Project Title (Chi):</label>
                    <input type="text" id="projTitleChi" value="關於將垃圾擺喺鏡頭前面就會話你知點掉嘅神奇網頁">
                </div>

                <div class="input-section">
                    <label for="websiteUrl">Project Website URL:</label>
                    <input type="url" id="websiteUrl"
                        placeholder="https://example.com"
                        value="https://example.com">
                    <small class="hint">Displayed in the left panel (must support iframe)</small>
                </div>

                <div class="input-section">
                    <label for="iframeZoom">Left Panel Zoom (%):</label>
                    <div class="zoom-input-row">
                        <input type="range" id="iframeZoomRange" min="25" max="200" value="100" step="5">
                        <input type="number" id="iframeZoom" min="25" max="200" value="100" step="5">
                        <span class="zoom-unit">%</span>
                    </div>
                </div>

                <div class="input-section">
                    <label for="qrUrl">Project QR Code URL:</label>
                    <input type="url" id="qrUrl"
                        placeholder="https://your-project-link.com">
                    <small class="hint">Defaults to the project URL above if left blank</small>
                </div>

                <div class="input-section">
                    <label for="studentNames">Student Name(s):</label>
                    <textarea id="studentNames" class="setup-textarea"
                        placeholder="One name per line&#10;e.g. Chan Tai Man&#10;Lee Siu Ming"></textarea>
                </div>

                <div class="input-section">
                    <label for="supervisorName">Supervisor:</label>
                    <input type="text" id="supervisorName"
                        placeholder="e.g. Dr. Wong Wai Kin">
                </div>

                <div class="input-section">
                    <label for="projDesc">Project Description:</label>
                    <textarea id="projDesc" class="setup-textarea"
                        placeholder="Brief description of your project..."></textarea>
                </div>

                <div class="input-section">
                    <label for="sloganEng">Slogan (Eng):</label>
                    <input type="text" id="sloganEng"
                        value="Interested in this project?">
                </div>

                <div class="input-section">
                    <label for="sloganChi">Slogan (Chi):</label>
                    <input type="text" id="sloganChi"
                        value="對呢個作品有興趣？">
                </div>
            </div>

            <!-- Section 2: Programme Info -->
            <div class="setup-section">
                <h3 class="setup-section-title">Programme Info</h3>

                <div class="input-section">
                    <label for="progNameEng">Programme Name (Eng):</label>
                    <input type="text" id="progNameEng"
                        value="HD in Applied AI">
                </div>

                <div class="input-section">
                    <label for="progNameChi">Programme Name (Chi):</label>
                    <input type="text" id="progNameChi"
                        value="應用人工智能高級文憑">
                </div>

                <div class="input-section">
                    <label for="courseCode">Course Code:</label>
                    <input type="text" id="courseCode"
                        value="IT114127">
                </div>
            </div>

            <!-- Section 3: Programme Page -->
            <div class="setup-section">
                <h3 class="setup-section-title">Programme Page</h3>

                <div class="input-section">
                    <label for="progDescEng">Programme Description (Eng):</label>
                    <textarea id="progDescEng" class="setup-textarea"
                        placeholder="Enter programme description in English..."></textarea>
                </div>

                <div class="input-section">
                    <label for="progDescChi">Programme Description (Chi):</label>
                    <textarea id="progDescChi" class="setup-textarea"
                        placeholder="輸入課程中文簡介..."></textarea>
                </div>

                <div class="input-section">
                    <label for="majorSubjectsEng">Major Subjects (Eng):</label>
                    <textarea id="majorSubjectsEng" class="setup-textarea">人工智能初階
機械流程自動化
機器學習
用戶體驗及界面設計
人工智能應用開發
雲端人工智能服務</textarea>
                </div>

                <div class="input-section">
                    <label for="majorSubjectsChi">Major Subjects (Chi):</label>
                    <textarea id="majorSubjectsChi" class="setup-textarea">人工智能初階
機械流程自動化
機器學習
用戶體驗及界面設計
人工智能應用開發
雲端人工智能服務</textarea>
                </div>

                <div class="input-section">
                    <label for="careerOppEng">Career Opportunities (Eng):</label>
                    <textarea id="careerOppEng" class="setup-textarea"
                        placeholder="e.g. AI Engineer&#10;Data Analyst&#10;ML Developer"></textarea>
                </div>

                <div class="input-section">
                    <label for="careerOppChi">Career Opportunities (Chi):</label>
                    <textarea id="careerOppChi" class="setup-textarea"
                        placeholder="例如：人工智能工程師&#10;資料分析師&#10;機器學習開發員"></textarea>
                </div>

                <div class="input-section">
                    <label for="progQrUrl">Programme QR Code URL:</label>
                    <input type="url" id="progQrUrl"
                        placeholder="https://hkiit.edu.hk/programme-page">
                    <small class="hint">Link shown on the programme information slide</small>
                </div>
            </div>

            <div class="button-group">
                <button id="startBtn" class="btn btn-primary">Start Showcase</button>
                <button id="demoBtn" class="btn btn-secondary">Try Demo</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

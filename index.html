<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Showcase - Setup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="start-screen">
        <div class="start-container">
            <h1>Project Showcase</h1>
            <p class="subtitle">Configure your showcase display</p>

            <div class="input-section">
                <label for="websiteUrl">Project Website URL:</label>
                <input
                    type="url"
                    id="websiteUrl"
                    placeholder="https://example.com"
                    value="https://example.com"
                >
                <small class="hint">URL of the project to display in the left panel (must support iframe embedding)</small>
            </div>

            <div class="input-section">
                <label for="qrUrl">QR Code URL:</label>
                <input
                    type="url"
                    id="qrUrl"
                    placeholder="https://your-project-link.com"
                >
                <small class="hint">URL that visitors will open after scanning the QR code</small>
            </div>

            <div class="input-section">
                <label for="progNameEng">Programme Name (Eng):</label>
                <input
                    type="text"
                    id="progNameEng"
                    value="HD in Applied AI"
                >
            </div>

            <div class="input-section">
                <label for="progNameChi">Programme Name (Chi):</label>
                <input
                    type="text"
                    id="progNameChi"
                    value="應用人工智能高級文憑"
                >
            </div>

            <div class="button-group">
                <button id="startBtn" class="btn btn-primary">Start Showcase</button>
                <button id="demoBtn" class="btn btn-secondary">Try Demo</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
